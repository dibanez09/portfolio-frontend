version: '3'

services:
  frontend:
    container_name: frontend
    image: registry.gitlab.com/teknovarik/ews/ews-3.0-frontend:${TAG}
    restart: unless-stopped
    ports:
      - 80:80
    environment:
      TZ: Asia/Manila
      VITE_PORT: 80
      VITE_BASE_URL: ${VITE_BASE_URL}
    networks:
      - ews-network
networks:
  ews-network:
    external: true
