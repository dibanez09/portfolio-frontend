services:
  frontend:
    container_name: frontend
    image: ${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - 80:80
    environment:
      TZ: Asia/Manila
      VITE_PORT: 80
      VITE_BASE_URL: ${VITE_BASE_URL}
      VITE_LANDING_PAGE_SPLINE: ${VITE_LANDING_PAGE_SPLINE}
    networks:
      - portfolio-network
networks:
  portfolio-network:
    external: true
