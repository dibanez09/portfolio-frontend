services:
  frontend:
    container_name: frontend
    image: ${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      TZ: Asia/Manila
      VITE_PORT: 80
      VITE_BASE_URL: ${VITE_BASE_URL}
    networks:
      - portfolio
networks:
  portfolio:
    external: true
