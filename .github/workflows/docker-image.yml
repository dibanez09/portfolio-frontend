name: Docker Image CI

on:
  push:
    branches: ['develop', 'feature/**']
  pull_request:
    branches: [ "develop" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build Image
        run: |
          docker login -u "danibanez09" -p ${{ secrets.DOCKER_PASSWORD }}
          docker image build -t portfolio/frontend:$(date +"%Y-%m-%d %T")-${{ steps.vars.outputs.sha_short }} .
      - name: Push Image
        run: docker push portfolio/frontend:$(date +"%Y-%m-%d %T")-${{ steps.vars.outputs.sha_short }}

